name: quickjs-wasi

# Builds the npm package in npm/quickjs-wasi: quickjs-wasi
# (https://github.com/vercel-labs/quickjs-wasi), the WASM embedding used for
# the browser, Node.js and Bun, with this fork as its engine. It runs the
# quickjs-wasi test suite on the build, which catches engine changes that
# break the embedding (the C interface layer, the extensions, snapshots,
# bytecode, limits and interrupts), then installs the packed tarball in an
# empty project and runs a smoke test under Node.js and Bun.
#
# The build is the one npm-publish.yml publishes, see npm/quickjs-wasi/build.sh
# for the pinned quickjs-wasi commit and the build options. The build without
# TypeScript checks that QJS_DISABLE_TYPESCRIPT keeps the embedding working.

on:
  pull_request:
    paths:
      - '**.c'
      - '**.h'
      - 'npm/quickjs-wasi/**'
      - '.github/workflows/quickjs-wasi.yml'
  push:
    branches:
      - next
    paths:
      - '**.c'
      - '**.h'
      - 'npm/quickjs-wasi/**'
      - '.github/workflows/quickjs-wasi.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quickjs-wasi-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quickjs-wasi:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: quickjs-wasi (${{ matrix.typescript && 'typescript' || 'no typescript' }})
    strategy:
      fail-fast: false
      matrix:
        typescript: [true, false]
    env:
      TYPESCRIPT: ${{ matrix.typescript && '1' || '0' }}
      WORK: ${{ github.workspace }}/npm/quickjs-wasi/build
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2

      - name: build and test
        run: RUN_TESTS=1 npm/quickjs-wasi/build.sh

      - name: smoke test
        run: npm/quickjs-wasi/smoke-test.sh

      - name: sizes
        working-directory: npm/quickjs-wasi/build/pkg
        run: |
          {
            echo "### $(node -p 'require("./package.json").build.opt'), typescript: ${{ matrix.typescript }}"
            echo
            echo "| file | bytes | gzip -9 |"
            echo "|---|---:|---:|"
            for f in quickjs.wasm extensions/*/*.so; do
              echo "| $f | $(wc -c < "$f") | $(gzip -9c "$f" | wc -c) |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: quickjs-wasi-${{ matrix.typescript && 'typescript' || 'no-typescript' }}
          path: npm/quickjs-wasi/build/*.tgz
