name: rust

# Checks rust/rquickjs-sys, rquickjs-sys with the engine of this repository.
#
#   - bindings: on each native runner, regenerates the bundled bindings of its
#     target with bindgen and fails if they differ from the committed ones.
#     rquickjs-sys bakes the engine's internal atom numbers and struct layouts
#     into them, so a change of quickjs.h or quickjs-atom.h (a new atom, say)
#     needs new bindings. The regenerated file is uploaded: commit it to
#     rust/rquickjs-sys/src/bindings/. The other targets are generated the
#     same way (cargo build --target <target> --features bindgen,update-bindings)
#     given their headers.
#   - test: runs the rquickjs test suite with this crate (rust/test-rquickjs.sh).

on:
  pull_request:
    paths:
      - '**.c'
      - '**.h'
      - 'rust/**'
      - '.github/workflows/rust.yml'
  push:
    branches:
      - next
    paths:
      - '**.c'
      - '**.h'
      - 'rust/**'
      - '.github/workflows/rust.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bindings:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    name: bindings (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-15-intel, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: windows-11-arm, target: aarch64-pc-windows-msvc }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: install rust
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: point bindgen at libclang
        if: runner.os == 'Windows'
        run: echo "LIBCLANG_PATH=C:\\Program Files\\LLVM\\bin" >> "$GITHUB_ENV"

      - name: regenerate
        working-directory: rust/rquickjs-sys
        run: cargo build --features bindgen,update-bindings

      - name: compare
        working-directory: rust/rquickjs-sys
        run: |
          file=src/bindings/${{ matrix.target }}.rs
          if ! git diff --quiet -- "$file"; then
            git diff --stat -- "$file"
            echo "::error file=rust/rquickjs-sys/$file::bindings are out of date: commit the regenerated file from the artifact of this job"
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: bindings-${{ matrix.target }}
          path: rust/rquickjs-sys/src/bindings/${{ matrix.target }}.rs

  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    name: rquickjs tests (${{ matrix.os }}${{ matrix.typescript == false && ', no typescript' || '' }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, typescript: true }
          - { os: ubuntu-latest, typescript: false }
          - { os: macos-latest, typescript: true }
          - { os: windows-latest, typescript: true }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: install rust
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: test
        run: |
          if [ "${{ matrix.typescript }}" = false ]; then
            rust/test-rquickjs.sh --features full-async,rquickjs-sys/disable-typescript
          else
            rust/test-rquickjs.sh
          fi
