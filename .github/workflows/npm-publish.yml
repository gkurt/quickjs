name: npm-publish

# Publishes the npm package in npm/quickjs-wasi whenever its version is not on
# npm yet: bump "version" in npm/quickjs-wasi/package.json and push to next.
# A run whose version is already published does nothing. It can also be run
# by hand. The package is built by build.sh as in quickjs-wasi.yml, and only
# published once the quickjs-wasi tests and the smoke test pass.
#
# Authentication: the npm trusted publisher for this repository and workflow
# (OIDC, no secret), or an NPM_TOKEN secret.

on:
  push:
    branches:
      - next
    paths:
      - 'npm/quickjs-wasi/package.json'
      - '.github/workflows/npm-publish.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # trusted publishing and provenance

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WORK: ${{ github.workspace }}/npm/quickjs-wasi/build
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: check the version
        id: version
        run: |
          name=$(node -p 'require("./npm/quickjs-wasi/package.json").name')
          version=$(node -p 'require("./npm/quickjs-wasi/package.json").version')
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "::notice::$name@$version is already published, nothing to do"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: oven-sh/setup-bun@v2
        if: steps.version.outputs.publish == 'true'

      - name: build and test
        if: steps.version.outputs.publish == 'true'
        run: RUN_TESTS=1 npm/quickjs-wasi/build.sh

      - name: smoke test
        if: steps.version.outputs.publish == 'true'
        run: npm/quickjs-wasi/smoke-test.sh

      # trusted publishing needs npm >= 11.5.1, newer than the one of Node 22
      - name: publish
        if: steps.version.outputs.publish == 'true'
        working-directory: npm/quickjs-wasi/build/pkg
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm install -g npm@11
          npm publish --provenance --access public
          {
            echo "### published ${{ steps.version.outputs.name }}@${{ steps.version.outputs.version }}"
            echo
            echo '```json'
            node -p 'JSON.stringify(require("./package.json").build, null, 2)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
