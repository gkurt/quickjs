name: bench

# Runs the runtime micro benchmarks (bench/runtime.js).
#
# On pull requests the PR head is compared against the merge base: both are
# built in Release mode and benchmarked in alternation three times, the best
# time of each benchmark on each side is compared and the table is posted as
# a comment on the PR (updated in place on later pushes) and to the job
# summary. On pushes to the default branch the results are kept as a workflow
# artifact so a history is available.
#
# Hosted runners are noisy: treat single-digit changes as noise and look for
# consistent shifts across related benchmarks. Re-run the job when in doubt.

on:
  pull_request:
    paths:
      - '**.c'
      - '**.h'
      - 'CMakeLists.txt'
      - 'Makefile'
      - 'bench/**'
      - '.github/workflows/bench.yml'
  push:
    branches:
      - next
    paths:
      - '**.c'
      - '**.h'
      - 'CMakeLists.txt'
      - 'Makefile'
      - 'bench/**'
      - '.github/workflows/bench.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: bench-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  BENCH_RUNS: 3
  BENCH_ARGS: --rounds 5 --min-ms 100

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: build head
        run: |
          make BUILD_DIR=build-head BUILD_TYPE=Release

      - name: build base
        if: github.event_name == 'pull_request'
        run: |
          base=$(git merge-base "${{ github.event.pull_request.base.sha }}" HEAD)
          echo "comparing against $base"
          echo "$base" > base.sha
          git worktree add ../base "$base"
          make -C ../base BUILD_DIR=build BUILD_TYPE=Release

      - name: benchmark
        run: |
          mkdir -p results
          if [ -f base.sha ]; then
            # alternate base and head so that slow phases of the runner hit both
            for i in $(seq 1 "$BENCH_RUNS"); do
              echo "::group::base run $i"
              ../base/build/qjs bench/runtime.js $BENCH_ARGS --json "results/base-$i.json"
              echo "::endgroup::"
              echo "::group::head run $i"
              build-head/qjs bench/runtime.js $BENCH_ARGS --json "results/head-$i.json"
              echo "::endgroup::"
            done
          else
            for i in $(seq 1 "$BENCH_RUNS"); do
              echo "::group::run $i"
              build-head/qjs bench/runtime.js $BENCH_ARGS --json "results/head-$i.json"
              echo "::endgroup::"
            done
          fi

      - name: compare
        if: github.event_name == 'pull_request'
        run: |
          base_files=$(ls results/base-*.json | paste -sd,)
          head_files=$(ls results/head-*.json | paste -sd,)
          {
            echo "<!-- runtime-bench -->"
            build-head/qjs bench/compare.js --markdown "$base_files" "$head_files"
            echo ""
            echo "<sub>Base: \`$(cat base.sha | cut -c1-12)\` · Head: \`$(git rev-parse --short=12 HEAD)\` ·" \
                 "Runner: \`${{ runner.os }}/${{ runner.arch }}\` ·" \
                 "[Job](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})</sub>"
          } > results/comment.md
          cat results/comment.md >> "$GITHUB_STEP_SUMMARY"
          build-head/qjs bench/compare.js "$base_files" "$head_files"

      - name: summary (push)
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "### Runtime benchmarks (\`$(git rev-parse --short=12 HEAD)\`)"
            echo ""
            build-head/qjs bench/compare.js --markdown "$(ls results/head-*.json | paste -sd,)"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: bench-results-${{ github.event.pull_request.number || github.sha }}
          path: results/
          retention-days: 90

      # The GITHUB_TOKEN of a pull request from a fork is read-only, so the
      # comment can only be posted for branches of this repository. The job
      # summary above always has the table.
      - name: comment on the pull request
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('results/comment.md', 'utf8');
            const marker = '<!-- runtime-bench -->';
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
